<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Дейлик — планировщик</title>
  </head>
  <body>
    <header class="row between">
      <h1 data-i18n="app.name">Дейлик</h1>
      <div class="row">
        <button id="lang" class="secondary">EN</button>
        <button id="bell" class="secondary" data-i18n="bell.enable">Включить напоминания</button>
      </div>
    </header>
    <nav>
      <button data-tab="day" data-i18n="nav.day">День</button>
      <button data-tab="spheres" data-i18n="nav.spheres">Сферы</button>
      <button data-tab="input" data-i18n="nav.input">Ввод</button>
      <button data-tab="log" data-i18n="nav.log">Журнал</button>
    </nav>
    <main>
      <section id="tab-day" hidden></section>
      <section id="tab-spheres" hidden></section>
      <section id="tab-input" hidden></section>
      <section id="tab-log" hidden></section>
    </main>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
