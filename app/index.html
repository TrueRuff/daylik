<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#333a45" />
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="icon" type="image/png" href="icon-192.png" />
    <link rel="apple-touch-icon" href="icon-192.png" />
    <title>Дейлик — планировщик</title>
    <script>
      // тема до первой отрисовки: сохранённый выбор или системная
      try {
        const t = localStorage.getItem('daylik-theme');
        if (t === 'dark' || t === 'light') document.documentElement.dataset.theme = t;
        else if (matchMedia('(prefers-color-scheme: dark)').matches) {
          document.documentElement.dataset.theme = 'dark';
        }
      } catch {}
    </script>
  </head>
  <body>
    <header class="row between">
      <h1><img class="logo" src="icon-192.png" alt=""><span data-i18n="app.name">Дейлик</span></h1>
      <div class="row">
        <span id="who" class="muted" hidden></span>
        <button id="logout" class="secondary" data-i18n="auth.logout" hidden>Выйти</button>
        <button id="lang" class="secondary" hidden>EN</button>
        <button id="theme" class="secondary" data-i18n-title="theme.toggle" hidden>☾</button>
        <button id="bell" class="secondary" data-i18n="bell.enable" hidden>Включить напоминания</button>
      </div>
    </header>
    <section id="auth" class="auth-wrap"></section>
    <nav hidden>
      <button data-tab="day" data-i18n="nav.day">День</button>
      <button data-tab="calendar" data-i18n="nav.calendar">Календарь</button>
      <button data-tab="spheres" data-i18n="nav.spheres">Направления</button>
      <button data-tab="input" data-i18n="nav.input">Ввод</button>
      <button data-tab="log" data-i18n="nav.log" hidden>Журнал</button>
    </nav>
    <main hidden>
      <section id="tab-day" hidden></section>
      <section id="tab-calendar" hidden></section>
      <section id="tab-spheres" hidden></section>
      <section id="tab-input" hidden></section>
      <section id="tab-log" hidden></section>
    </main>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
