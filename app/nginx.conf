server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # .webmanifest нет в стандартном mime.types, без правильного типа Chrome не даст установить PWA
  types {
    application/manifest+json webmanifest;
  }

  # manifest и service worker не кэшируем — иначе обновления приложения застревают
  location = /sw.js {
    add_header Cache-Control "no-cache";
  }
  location ~* \.(webmanifest|png)$ {
    expires 7d;
  }
  # именованные сборкой файлы можно кэшировать навсегда
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
  }

  # SPA: любой неизвестный путь отдаёт index.html
  location / {
    try_files $uri $uri/ /index.html;
  }

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;
}
